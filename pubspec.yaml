workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: neu_planner
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - neu_planner/build/app/outputs/flutter-apk/*.apk
